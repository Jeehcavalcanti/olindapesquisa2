<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa Carnaval 2026</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0d9488">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100 select-none">
    <div id="root"></div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log(err));
            });
        }
    </script>

    <script type="text/babel">
        // SUAS CHAVES JÁ ESTÃO AQUI:
        const firebaseConfig = {
            apiKey: "AIzaSyAMIs-8XGJqGN_MyypN7T8qadUvd_kH4lk",
            authDomain: "olindapesquisa-a9a42.firebaseapp.com",
            projectId: "olindapesquisa-a9a42",
            storageBucket: "olindapesquisa-a9a42.firebasestorage.app",
            messagingSenderId: "562747371588",
            appId: "1:562747371588:web:30166bb529498a49f48c11",
            measurementId: "G-Q9KEXJLZ6R"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        try { db.enablePersistence().catch(() => {}); } catch(e) {}

        const { useState, useEffect } = React;

        function App() {
            const [step, setStep] = useState(1);
            const [online, setOnline] = useState(navigator.onLine);
            const [sucesso, setSucesso] = useState(false);
            const [installPrompt, setInstallPrompt] = useState(null);

            const [formData, setFormData] = useState({
                pesquisador: localStorage.getItem('pesquisador_nome') || '',
                pais: 'Brasil', estado: '', cidade: '',
                faixaEtaria: '', sexo: '', escolaridade: '', estadoCivil: '', renda: '',
                despesaMedia: '', servicos: [], tempoPermanencia: '', acompanhantes: [], qtdAcompanhantes: '',
                organizacaoViagem: '', sitesInfluencia: [], transporte: '', hospedagem: '', passeioTuristico: false
            });

            useEffect(() => {
                window.addEventListener('online', () => setOnline(true));
                window.addEventListener('offline', () => setOnline(false));
                window.addEventListener('beforeinstallprompt', (e) => {
                    e.preventDefault();
                    setInstallPrompt(e);
                });
                lucide.createIcons();
            }, [step, sucesso]);

            const handleChange = (e) => {
                const { name, value, type, checked } = e.target;
                if (type === 'checkbox') {
                    const list = formData[name] || [];
                    if (checked) setFormData({ ...formData, [name]: [...list, value] });
                    else setFormData({ ...formData, [name]: list.filter(item => item !== value) });
                } else if (name === 'passeioTuristico') {
                    setFormData({...formData, [name]: checked});
                } else {
                    setFormData({ ...formData, [name]: value });
                }
            };

            const instalar = () => {
                if (installPrompt) {
                    installPrompt.prompt();
                    setInstallPrompt(null);
                } else {
                    alert("Para instalar:\niPhone: Toque em Compartilhar > Adicionar à Tela de Início.\nAndroid: Toque nos 3 pontinhos > Instalar aplicativo.");
                }
            };

            const salvarAgora = () => {
                if (!formData.pesquisador) return alert("Preencha o nome do pesquisador!");
                
                // DESTRAVA IMEDIATAMENTE (Não espera o Google)
                setSucesso(true); 

                // Envia em segundo plano
                db.collection("pesquisas_carnaval_2026").add({
                    ...formData,
                    data_registro: new Date(),
                    status: navigator.onLine ? "Online" : "Pendente Offline"
                });

                // Reinicia em 1.5s
                setTimeout(() => {
                    setSucesso(false);
                    setStep(1);
                    setFormData(prev => ({ ...prev, cidade: '', servicos: [], sitesInfluencia: [], acompanhantes: [], passeioTuristico: false }));
                    window.scrollTo(0,0);
                }, 1500);
            };

            if (sucesso) return (
                <div className="min-h-screen flex flex-col items-center justify-center bg-green-600 text-white p-6 text-center">
                    <h1 className="text-4xl font-bold mb-4">SALVO!</h1>
                    <p className="text-xl">Sincronizando em segundo plano...</p>
                </div>
            );

            return (
                <div className="pb-20 font-sans text-gray-800 bg-gray-50 min-h-screen">
                    <div className={`fixed top-0 left-0 w-full p-3 flex justify-between items-center px-4 shadow z-50 text-white font-bold ${online ? 'bg-teal-600' : 'bg-orange-600'}`}>
                        <span className="flex items-center gap-2">
                             {online ? "ONLINE" : "OFFLINE"}
                        </span>
                        <button onClick={instalar} className="bg-white text-teal-800 px-3 py-1 rounded text-xs uppercase shadow font-bold">
                            BAIXAR APP
                        </button>
                    </div>

                    <div className="max-w-md mx-auto bg-white rounded-xl shadow-lg mt-16 p-6 border border-gray-200">
                        <div className="mb-4">
                            <h2 className="text-xl font-bold">Carnaval 2026</h2>
                            <div className="w-full bg-gray-200 h-2 rounded mt-2">
                                <div className="bg-teal-500 h-2 rounded transition-all" style={{ width: `${(step/4)*100}%` }}></div>
                            </div>
                        </div>

                        {step === 1 && (
                            <div className="space-y-4">
                                <div className="text-teal-700 font-bold border-b pb-1">1. Origem</div>
                                <input className="w-full p-3 border rounded bg-gray-50" placeholder="Nome do Pesquisador" value={formData.pesquisador} 
                                    onChange={(e) => {
                                        setFormData({...formData, pesquisador: e.target.value});
                                        localStorage.setItem('pesquisador_nome', e.target.value);
                                    }} />
                                <select name="estado" value={formData.estado} onChange={handleChange} className="w-full p-3 border rounded bg-white"><option value="">Estado</option><option>PE</option><option>SP</option><option>RJ</option><option>PB</option><option>BA</option><option>Outro</option></select>
                                <input name="cidade" placeholder="Cidade" value={formData.cidade} onChange={handleChange} className="w-full p-3 border rounded bg-gray-50" />
                            </div>
                        )}

                        {step === 2 && (
                            <div className="space-y-4">
                                <div className="text-teal-700 font-bold border-b pb-1">2. Perfil</div>
                                <select name="faixaEtaria" value={formData.faixaEtaria} onChange={handleChange} className="w-full p-3 border rounded"><option value="">Faixa Etária</option><option>18-24</option><option>25-34</option><option>35-44</option><option>45+</option></select>
                                <select name="sexo" value={formData.sexo} onChange={handleChange} className="w-full p-3 border rounded"><option value="">Sexo</option><option>Masc</option><option>Fem</option></select>
                                <select name="escolaridade" value={formData.escolaridade} onChange={handleChange} className="w-full p-3 border rounded"><option value="">Escolaridade</option><option>Fundamental</option><option>Médio</option><option>Superior</option></select>
                                <select name="renda" value={formData.renda} onChange={handleChange} className="w-full p-3 border rounded"><option value="">Renda</option><option>Até 1 SM</option><option>1-3</option><option>3+</option></select>
                            </div>
                        )}
                        
                        {step === 3 && (
                            <div className="space-y-4">
                                <div className="text-teal-700 font-bold border-b pb-1">3. Economia</div>
                                <select name="despesaMedia" value={formData.despesaMedia} onChange={handleChange} className="w-full p-3 border rounded"><option value="">Gasto Diário</option><option>Até R$100</option><option>R$100-300</option><option>R$300+</option></select>
                                <div className="grid grid-cols-2 gap-2 text-sm">{['Alimentação', 'Hospedagem', 'Transporte', 'Passeios'].map(o => <label key={o} className="flex gap-2"><input type="checkbox" name="servicos" value={o} onChange={handleChange}/>{o}</label>)}</div>
                            </div>
                        )}

                        {step === 4 && (
                            <div className="space-y-4">
                                <div className="text-teal-700 font-bold border-b pb-1">4. Viagem</div>
                                <select name="organizacaoViagem" value={formData.organizacaoViagem} onChange={handleChange} className="w-full p-3 border rounded"><option value="">Organização</option><option>Só</option><option>Agência</option></select>
                                <label className="flex items-center gap-2 mt-4 p-3 bg-gray-100 rounded"><input type="checkbox" name="passeioTuristico" checked={formData.passeioTuristico} onChange={handleChange} className="w-5 h-5"/> Passeio Turístico?</label>
                            </div>
                        )}

                        <div className="flex gap-3 mt-6">
                            {step > 1 && <button onClick={() => setStep(s => s - 1)} className="flex-1 py-3 bg-gray-200 rounded font-bold">Voltar</button>}
                            {step < 4 ? (
                                <button onClick={() => setStep(s => s + 1)} className="flex-1 py-3 bg-teal-600 text-white rounded font-bold">Próximo</button>
                            ) : (
                                <button onClick={salvarAgora} className="flex-1 py-3 bg-green-600 text-white rounded font-bold text-lg shadow-lg">SALVAR AGORA</button>
                            )}
                        </div>
                    </div>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
