<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa Carnaval 2026</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0d9488">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100 select-none">
    <div id="root"></div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log(err));
            });
        }
    </script>

    <script type="text/babel">
        // --- SUAS CHAVES AQUI ---
        // COLE SUAS CHAVES EXATAMENTE AQUI DENTRO
        const firebaseConfig = {
            apiKey: "AIzaSyAMIs-8XGJqGN_MyypN7T8qadUvd_kH4lk",
            authDomain: "olindapesquisa-a9a42.firebaseapp.com",
            projectId: "olindapesquisa-a9a42",
            storageBucket: "olindapesquisa-a9a42.firebasestorage.app",
            messagingSenderId: "562747371588",
            appId: "1:562747371588:web:30166bb529498a49f48c11",
            measurementId: "G-Q9KEXJLZ6R"
            };


        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        try { db.enablePersistence().catch(() => {}); } catch(e) {}

        const { useState, useEffect } = React;

        // Listas de Opções
        const ESTADOS = ["AC","AL","AP","AM","BA","CE","DF","ES","GO","MA","MT","MS","MG","PA","PB","PR","PE","PI","RJ","RN","RS","RO","RR","SC","SP","SE","TO"];
        const PAISES = ["Brasil", "Argentina", "Uruguai", "Paraguai", "Chile", "Estados Unidos", "Portugal", "Alemanha", "França", "Outro"];

        function App() {
            const [step, setStep] = useState(1);
            const [online, setOnline] = useState(navigator.onLine);
            const [sucesso, setSucesso] = useState(false);
            const [installPrompt, setInstallPrompt] = useState(null);

            const [formData, setFormData] = useState({
                pesquisador: localStorage.getItem('pesquisador_nome') || '',
                // Origem
                pais: 'Brasil', paisOutro: '',
                estado: '', 
                cidade: '',
                // Perfil
                faixaEtaria: '', 
                sexo: '', 
                escolaridade: '', escolaridadeOutro: '',
                estadoCivil: '', 
                renda: '',
                // Economia
                despesaMedia: '', 
                servicos: [], 
                tempoPermanencia: '', 
                acompanhantes: [], 
                qtdAcompanhantes: '',
                // Viagem
                organizacaoViagem: '', 
                sitesInfluencia: [], 
                transporte: '', 
                hospedagem: '', 
                passeioTuristico: false,
                // Avaliação
                satisfacao: '',
                pontosPositivos: [],
                pontosNegativos: []
            });

            useEffect(() => {
                window.addEventListener('online', () => setOnline(true));
                window.addEventListener('offline', () => setOnline(false));
                window.addEventListener('beforeinstallprompt', (e) => {
                    e.preventDefault();
                    setInstallPrompt(e);
                });
                lucide.createIcons();
            }, [step, sucesso]);

            const handleChange = (e) => {
                const { name, value, type, checked } = e.target;
                if (type === 'checkbox') {
                    const list = formData[name] || [];
                    if (checked) setFormData({ ...formData, [name]: [...list, value] });
                    else setFormData({ ...formData, [name]: list.filter(item => item !== value) });
                } else if (name === 'passeioTuristico') {
                    setFormData({...formData, [name]: checked});
                } else {
                    setFormData({ ...formData, [name]: value });
                }
            };

            const salvarAgora = () => {
                // ÚNICA VALIDAÇÃO: Nome do pesquisador
                if (!formData.pesquisador) return alert("Preencha o nome do Pesquisador!");
                
                setSucesso(true); 

                // Prepara dados (Junta os campos 'Outro' para ficar limpo no banco)
                const dadosFinais = { ...formData };
                if (formData.pais === 'Outro' && formData.paisOutro) dadosFinais.pais = `Outro: ${formData.paisOutro}`;
                if (formData.escolaridade === 'Outro' && formData.escolaridadeOutro) dadosFinais.escolaridade = `Outro: ${formData.escolaridadeOutro}`;

                db.collection("pesquisas_carnaval_2026").add({
                    ...dadosFinais,
                    data_registro: new Date(),
                    status: navigator.onLine ? "Online" : "Pendente Offline"
                });

                setTimeout(() => {
                    setSucesso(false);
                    setStep(1);
                    // Reseta campos variáveis (Mantém pesquisador)
                    setFormData(prev => ({ 
                        ...prev, 
                        cidade: '', paisOutro: '', escolaridadeOutro: '', servicos: [], sitesInfluencia: [], 
                        acompanhantes: [], pontosPositivos: [], pontosNegativos: [], satisfacao: '',
                        passeioTuristico: false
                    }));
                    window.scrollTo(0,0);
                }, 1000);
            };

            const instalar = () => {
                if (installPrompt) { installPrompt.prompt(); setInstallPrompt(null); }
                else { alert("Para instalar:\niPhone: Compartilhar > Tela de Início\nAndroid: Menu > Instalar App"); }
            };

            if (sucesso) return (
                <div className="min-h-screen flex flex-col items-center justify-center bg-green-600 text-white p-6 text-center">
                    <h1 className="text-5xl font-bold mb-4">SALVO!</h1>
                    <p className="text-xl">Pode continuar...</p>
                </div>
            );

            return (
                <div className="pb-24 font-sans text-gray-800 bg-gray-50 min-h-screen">
                    <div className={`fixed top-0 left-0 w-full p-3 flex justify-between items-center px-4 shadow z-50 text-white font-bold ${online ? 'bg-teal-600' : 'bg-orange-600'}`}>
                        <span className="flex items-center gap-2">{online ? "ONLINE" : "OFFLINE"}</span>
                        <button onClick={instalar} className="bg-white text-teal-800 px-3 py-1 rounded text-xs uppercase shadow font-bold">APP</button>
                    </div>

                    <div className="max-w-md mx-auto bg-white rounded-xl shadow-lg mt-16 p-6 border border-gray-200">
                        <div className="mb-4">
                            <h2 className="text-xl font-bold">Carnaval 2026</h2>
                            <div className="w-full bg-gray-200 h-2 rounded mt-2">
                                <div className="bg-teal-500 h-2 rounded transition-all" style={{ width: `${(step/5)*100}%` }}></div>
                            </div>
                            <p className="text-xs text-right mt-1 text-gray-500">Etapa {step} de 5</p>
                        </div>

                        {/* --- ETAPA 1: ORIGEM --- */}
                        {step === 1 && (
                            <div className="space-y-4 animate-fade-in">
                                <div className="text-teal-700 font-bold border-b pb-1 text-lg">1. Origem</div>
                                
                                <input className="w-full p-3 border rounded bg-yellow-50 font-bold" placeholder="NOME DO PESQUISADOR" value={formData.pesquisador} 
                                    onChange={(e) => {
                                        setFormData({...formData, pesquisador: e.target.value});
                                        localStorage.setItem('pesquisador_nome', e.target.value);
                                    }} />

                                <label className="block text-sm font-bold text-gray-600 mt-2">País de Origem:</label>
                                <select name="pais" value={formData.pais} onChange={handleChange} className="w-full p-3 border rounded bg-white">
                                    {PAISES.map(p => <option key={p} value={p}>{p}</option>)}
                                </select>
                                {formData.pais === 'Outro' && (
                                    <input name="paisOutro" placeholder="Digite o país..." value={formData.paisOutro} onChange={handleChange} className="w-full p-3 border rounded bg-gray-50" />
                                )}

                                <label className="block text-sm font-bold text-gray-600 mt-2">Estado:</label>
                                <select name="estado" value={formData.estado} onChange={handleChange} className="w-full p-3 border rounded bg-white">
                                    <option value="">Selecione...</option>
                                    {ESTADOS.map(uf => <option key={uf} value={uf}>{uf}</option>)}
                                </select>

                                <label className="block text-sm font-bold text-gray-600 mt-2">Município (Manual):</label>
                                <input name="cidade" placeholder="Digite a cidade..." value={formData.cidade} onChange={handleChange} className="w-full p-3 border rounded bg-white" />
                            </div>
                        )}

                        {/* --- ETAPA 2: PERFIL --- */}
                        {step === 2 && (
                            <div className="space-y-4">
                                <div className="text-teal-700 font-bold border-b pb-1 text-lg">2. Perfil</div>
                                
                                <select name="faixaEtaria" value={formData.faixaEtaria} onChange={handleChange} className="w-full p-3 border rounded bg-white font-medium">
                                    <option value="">Faixa Etária</option>
                                    <option>12 - 24</option><option>25 - 34</option><option>35 - 44</option>
                                    <option>45 - 54</option><option>55+</option>
                                </select>

                                <select name="sexo" value={formData.sexo} onChange={handleChange} className="w-full p-3 border rounded bg-white font-medium">
                                    <option value="">Sexo</option>
                                    <option>Feminino</option><option>Masculino</option>
                                    <option>Outro</option><option>Prefiro não responder</option>
                                </select>

                                <select name="escolaridade" value={formData.escolaridade} onChange={handleChange} className="w-full p-3 border rounded bg-white font-medium">
                                    <option value="">Escolaridade</option>
                                    <option>Fundamental</option><option>Médio</option><option>Superior</option>
                                    <option>Sem Instrução</option><option>Outro</option>
                                </select>
                                {formData.escolaridade === 'Outro' && (
                                    <input name="escolaridadeOutro" placeholder="Qual?" value={formData.escolaridadeOutro} onChange={handleChange} className="w-full p-3 border rounded bg-gray-50" />
                                )}

                                <select name="estadoCivil" value={formData.estadoCivil} onChange={handleChange} className="w-full p-3 border rounded bg-white font-medium">
                                    <option value="">Estado Civil</option>
                                    <option>Solteiro</option><option>Casado</option><option>União Estável</option>
                                    <option>Viúvo</option><option>Divorciado/Separado</option>
                                </select>

                                <select name="renda" value={formData.renda} onChange={handleChange} className="w-full p-3 border rounded bg-white font-medium">
                                    <option value="">Renda Familiar</option>
                                    <option>Até 2000</option><option>2000 a 5000</option><option>5000 a 10000</option>
                                    <option>10001 a 12999</option><option>Mais de 13000</option>
                                    <option>Prefiro não opinar</option>
                                </select>
                            </div>
                        )}

                        {/* --- ETAPA 3: ECONOMIA --- */}
                        {step === 3 && (
                            <div className="space-y-4">
                                <div className="text-teal-700 font-bold border-b pb-1 text-lg">3. Economia</div>
                                
                                <select name="despesaMedia" value={formData.despesaMedia} onChange={handleChange} className="w-full p-3 border rounded bg-white font-medium">
                                    <option value="">Despesa Diária por Pessoa</option>
                                    <option>Até 50</option><option>50 a 99</option><option>100 a 149</option>
                                    <option>150 a 199</option><option>250 a 299</option>
                                    <option>300 a 349</option><option>350 a 399</option><option>Mais de 400</option>
                                </select>

                                <p className="font-bold text-sm text-gray-700 mt-2">Serviços Utilizados:</p>
                                <div className="grid grid-cols-2 gap-2 text-sm">
                                    {['Alimentação', 'Transporte', 'Day Use', 'Hospedagem', 'Atrativos e Passeios', 'Compras'].map(o => 
                                        <label key={o} className="flex gap-2 p-2 border rounded bg-white"><input type="checkbox" name="servicos" value={o} onChange={handleChange}/>{o}</label>
                                    )}
                                </div>

                                <select name="tempoPermanencia" value={formData.tempoPermanencia} onChange={handleChange} className="w-full p-3 border rounded bg-white mt-2 font-medium">
                                    <option value="">Tempo de Permanência</option>
                                    <option>Menos de 24 horas</option><option>Um dia</option><option>2 dias</option>
                                    <option>3 dias</option><option>4 dias</option><option>Todos os dias do Carnaval</option>
                                </select>

                                <p className="font-bold text-sm text-gray-700 mt-2">Acompanhantes (Múltipla):</p>
                                <div className="grid grid-cols-2 gap-2 text-sm">
                                    {['Sozinho', 'Amigos', 'Sem Filhos', 'Com Parentes', 'Cônjuge/Namorado(a)', 'Filhos', 'Com Filhos e Parentes'].map(o => 
                                        <label key={o} className="flex gap-2 p-1"><input type="checkbox" name="acompanhantes" value={o} onChange={handleChange}/>{o}</label>
                                    )}
                                </div>

                                <select name="qtdAcompanhantes" value={formData.qtdAcompanhantes} onChange={handleChange} className="w-full p-3 border rounded bg-white mt-2 font-medium">
                                    <option value="">Quantos Acompanhantes?</option>
                                    <option>Nenhum</option><option>1</option><option>2</option>
                                    <option>3</option><option>4</option><option>+4</option>
                                </select>
                            </div>
                        )}

                        {/* --- ETAPA 4: VIAGEM --- */}
                        {step === 4 && (
                            <div className="space-y-4">
                                <div className="text-teal-700 font-bold border-b pb-1 text-lg">4. Viagem</div>
                                
                                <select name="organizacaoViagem" value={formData.organizacaoViagem} onChange={handleChange} className="w-full p-3 border rounded bg-white font-medium">
                                    <option value="">Organização</option>
                                    <option>Organização Própria</option><option>Agência</option><option>Outro</option>
                                </select>

                                <p className="font-bold text-sm text-gray-700 mt-2">Sites de Influência:</p>
                                <div className="grid grid-cols-2 gap-2 text-sm">
                                    {['Airbnb', 'Decolar', 'Hurb', 'Site do Evento', 'Booking', 'Facebook', 'Instagram', 'TripAdvisor'].map(o => 
                                        <label key={o} className="flex gap-2"><input type="checkbox" name="sitesInfluencia" value={o} onChange={handleChange}/>{o}</label>
                                    )}
                                </div>

                                <label className="block text-sm font-bold text-gray-600 mt-2">Transporte Principal:</label>
                                <select name="transporte" value={formData.transporte} onChange={handleChange} className="w-full p-3 border rounded bg-white font-medium">
                                    <option value="">Selecione...</option>
                                    <option>Carro Próprio</option><option>Carro Locado</option><option>Ônibus/Van Fretada</option>
                                    <option>Ônibus/Van Linha</option><option>Moto</option><option>Táxi</option><option>Serviço de App</option>
                                </select>

                                <label className="block text-sm font-bold text-gray-600 mt-2">Hospedagem:</label>
                                <select name="hospedagem" value={formData.hospedagem} onChange={handleChange} className="w-full p-3 border rounded bg-white font-medium">
                                    <option value="">Selecione...</option>
                                    <option>Hotel</option><option>Pousada</option><option>Casa Alugada</option>
                                    <option>Casa de Parentes/Amigos</option><option>Hostel</option><option>Camping</option>
                                    <option>Cama e Café</option><option>Não utilizou</option>
                                </select>

                                <label className="flex items-center gap-4 mt-4 p-4 bg-teal-50 border border-teal-200 rounded-lg cursor-pointer">
                                    <input type="checkbox" name="passeioTuristico" checked={formData.passeioTuristico} onChange={handleChange} className="w-6 h-6 text-teal-600"/> 
                                    <span className="font-bold text-teal-900">Realizou Passeio Turístico?</span>
                                </label>
                            </div>
                        )}

                        {/* --- ETAPA 5: AVALIAÇÃO --- */}
                        {step === 5 && (
                            <div className="space-y-4">
                                <div className="text-teal-700 font-bold border-b pb-1 text-lg">5. Avaliação</div>
                                
                                <label className="block text-sm font-bold">Satisfação Geral (1 a 5):</label>
                                <div className="flex justify-between gap-1">
                                    {[1, 2, 3, 4, 5].map(num => (
                                        <button key={num} onClick={() => setFormData({...formData, satisfacao: num})}
                                            className={`p-3 w-full rounded border font-bold text-xl ${formData.satisfacao === num ? 'bg-teal-600 text-white' : 'bg-white'}`}>
                                            {num}
                                        </button>
                                    ))}
                                </div>

                                <p className="font-bold text-sm text-gray-700 mt-2">Pontos Positivos:</p>
                                <div className="grid grid-cols-1 gap-2 text-sm">
                                    {['Atmosfera Contagiante', 'Diversidade e Atrações', 'Segurança', 'Limpeza', 'Organização', 'Facilidade de Acesso', 'Infraestrutura', 'Hospitalidade', 'Beleza da Cidade'].map(o => 
                                        <label key={o} className="flex gap-2 p-2 border rounded hover:bg-green-50"><input type="checkbox" name="pontosPositivos" value={o} onChange={handleChange}/>{o}</label>
                                    )}
                                </div>

                                <p className="font-bold text-sm text-gray-700 mt-2">Pontos Negativos:</p>
                                <div className="grid grid-cols-1 gap-2 text-sm">
                                    {['Segurança Insuficiente', 'Limpeza Inadequada', 'Desorganização', 'Dificuldade de Acesso', 'Falta de Infraestrutura', 'Preços Abusivos', 'Poluição Sonora', 'Trânsito Congestionado'].map(o => 
                                        <label key={o} className="flex gap-2 p-2 border rounded hover:bg-red-50"><input type="checkbox" name="pontosNegativos" value={o} onChange={handleChange}/>{o}</label>
                                    )}
                                </div>
                            </div>
                        )}

                        <div className="flex gap-3 mt-6">
                            {step > 1 && <button onClick={() => setStep(s => s - 1)} className="flex-1 py-4 bg-gray-300 text-gray-800 rounded-lg font-bold">Voltar</button>}
                            {step < 5 ? (
                                <button onClick={() => setStep(s => s + 1)} className="flex-1 py-4 bg-teal-600 text-white rounded-lg font-bold shadow-lg">Próximo</button>
                            ) : (
                                <button onClick={salvarAgora} className="flex-1 py-4 bg-green-600 text-white rounded-lg font-bold text-lg shadow-xl animate-pulse">SALVAR FINAL</button>
                            )}
                        </div>
                    </div>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
